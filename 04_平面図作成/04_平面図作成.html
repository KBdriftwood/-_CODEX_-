  drawSiteFrame(ctx, doc.site);
  drawGrid(ctx, doc.site, cssW, cssH);

  const pairs = pairedItems(doc).map((pair) => ({
    equipment: pair.equipment,
    placement: pair.placement,
    emphasis: resolveDrawEmphasis(pair.equipment, pair.placement, pageRole)
  }));
  // 薄いもの→目立つものの順で重ね、アフター変更が手前に見えるようにする
  const drawOrder = pairs.slice().sort((a, b) => {
    const ae = a.emphasis === "emphasis" ? 1 : 0;
    const be = b.emphasis === "emphasis" ? 1 : 0;
    return ae - be;
  });
  drawOrder.forEach((pair) => {
    drawEquipmentBody(
      ctx,
      pair.equipment,
      pair.placement,
      selected.has(pair.placement.id),
      pair.emphasis
    );
  });

  drawGroupOverlays(ctx, doc, selected, pageRole);

  const labels = buildPlanLabels(doc);
  resolveLabelCollisions(labels);
  DrawView._labelHitList = labels;
  const emphasisByPlacement = new Map(
    pairs.map((pair) => [pair.placement.id, pair.emphasis])
  );
  const typeByPlacement = new Map(
    pairs.map((pair) => [pair.placement.id, pair.equipment.type])
  );
  labels.forEach((label) => {
    drawPlanLabel(
      ctx,
      label,
      selected.has(label.placementId),
      emphasisByPlacement.get(label.placementId) || "muted",
      typeByPlacement.get(label.placementId)
    );
  });
  DrawView.printMode = prevPrintMode;
}

function drawGroupOverlays(ctx, doc, selected, pageRole) {
  const groups = doc.drawing.groups || [];
  groups.forEach((group) => {
    const placements = getGroupPlacements(doc, group);
    if (placements.length < 2) {
      return;
    }
    const bounds = groupBoundsMm(doc, placements);
    if (!bounds) {
      return;
    }
    const a = worldToScreen(bounds.minX, bounds.minY);
    const b = worldToScreen(bounds.maxX, bounds.maxY);
    const active = placements.some((item) => selected.has(item.id));
    let accentType = null;
    if (pageRole === "after") {
      for (let i = 0; i < placements.length; i += 1) {
        const eq = findEquipment(doc, placements[i].equipmentId);
        if (isAfterOwnedItem(eq, placements[i])) {
          accentType = eq.type;
          break;
        }
      }
    }
    const afterOwned = !!accentType;
    const accent = afterAccentOf(accentType || "other");
    ctx.save();
    ctx.globalAlpha = active ? 1 : (afterOwned ? 1 : 0.55);
    ctx.setLineDash([6, 4]);
    ctx.strokeStyle = active || afterOwned ? accent.stroke : "rgba(90, 101, 112, 0.45)";
    ctx.lineWidth = active ? 2.2 : (afterOwned ? 2 : 1.15);
    ctx.strokeRect(a.x - 3, a.y - 3, b.x - a.x + 6, b.y - a.y + 6);
    ctx.setLineDash([]);
    ctx.font = (DrawView.printMode ? "700 16px" : "11px") + " Yu Gothic UI, Meiryo, sans-serif";
    ctx.fillStyle = active || afterOwned
      ? (DrawView.printMode ? mixHex(accent.label, "#000000", 0.25) : accent.label)
      : (DrawView.printMode ? "#1a1e24" : "rgba(42, 46, 52, 0.55)");
    ctx.strokeStyle = "rgba(255, 255, 255, 0.92)";
    ctx.lineWidth = DrawView.printMode ? 4.5 : 3;
    ctx.textAlign = "left";
    ctx.textBaseline = "bottom";
    const label = group.name || DEFAULT_GROUP_NAME;
    ctx.strokeText(label, a.x, a.y - 4);
    ctx.fillText(label, a.x, a.y - 4);
    ctx.restore();
  });
}

function drawSiteFrame(ctx, site) {
  const a = worldToScreen(0, 0);
  const b = worldToScreen(site.widthMm, site.depthMm);
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(a.x, a.y, b.x - a.x, b.y - a.y);
  ctx.strokeStyle = "#8a9099";
  ctx.lineWidth = 1.5;
  ctx.strokeRect(a.x, a.y, b.x - a.x, b.y - a.y);
}

function drawGrid(ctx, site, cssW, cssH) {
  const step = chooseGridStepMm();
  const minor = step <= 100 ? null : (step >= 5000 ? 1000 : 100);
  const origin = worldToScreen(0, 0);
  const end = worldToScreen(site.widthMm, site.depthMm);

  ctx.save();
  ctx.beginPath();
  ctx.rect(Math.min(origin.x, end.x), Math.min(origin.y, end.y), Math.abs(end.x - origin.x), Math.abs(end.y - origin.y));
  ctx.clip();

  if (minor && minor * DrawView.scale >= 8) {
    const maxLines = 500;
    const countX = Math.ceil(site.widthMm / minor);
    const countY = Math.ceil(site.depthMm / minor);
    if (countX + countY <= maxLines * 2) {
      strokeGrid(
        ctx,
        site,
        minor,
        DrawView.printMode ? "rgba(180, 184, 190, 0.22)" : "rgba(180, 184, 190, 0.35)",
        DrawView.printMode ? 0.8 : 1
      );
    }
  }
  strokeGrid(
    ctx,
    site,
    step,
    DrawView.printMode ? "rgba(120, 126, 136, 0.35)" : "rgba(120, 126, 136, 0.55)",
    DrawView.printMode ? 1 : 1
  );

  ctx.fillStyle = DrawView.printMode ? "#2a2e34" : "#6b717a";
  ctx.font = (DrawView.printMode ? "700 16px" : "12px") + " Yu Gothic UI, Meiryo, sans-serif";
  ctx.fillText("0", origin.x + 4, origin.y + (DrawView.printMode ? 18 : 14));
  ctx.fillText(formatMm(site.widthMm), end.x - (DrawView.printMode ? 100 : 70), origin.y + (DrawView.printMode ? 18 : 14));
  ctx.fillText(formatMm(site.depthMm), origin.x + 4, end.y - (DrawView.printMode ? 12 : 8));

  ctx.restore();

  DrawView.gridStepMm = step;
  DrawView.gridMinorMm = minor;
}

function strokeGrid(ctx, site, step, color, width) {
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.beginPath();
  for (let x = 0; x <= site.widthMm; x += step) {
    const p0 = worldToScreen(x, 0);
    const p1 = worldToScreen(x, site.depthMm);
    ctx.moveTo(p0.x, p0.y);
    ctx.lineTo(p1.x, p1.y);
  }
  for (let y = 0; y <= site.depthMm; y += step) {
    const p0 = worldToScreen(0, y);
    const p1 = worldToScreen(site.widthMm, y);
    ctx.moveTo(p0.x, p0.y);
    ctx.lineTo(p1.x, p1.y);
  }
  ctx.stroke();
}

function drawEquipmentBody(ctx, equipment, placement, selected, emphasis) {
  const def = equipmentTypeOf(equipment.type);
  const tone = emphasis === "emphasis" ? "emphasis" : "muted";
  if (isPipeType(equipment.type)) {
    drawPipeBody(ctx, equipment, placement, selected, tone);
    return;
  }
  const fp = footprintOf(equipment, placement);
  const w = fp.widthMm;
  const d = fp.depthMm;
  if (w == null || d == null || w <= 0 || d <= 0) {
    return;
  }

  const p = worldToScreen(placement.xMm, placement.yMm);
  const size = {
    w: w * DrawView.scale,
    d: d * DrawView.scale
  };

  ctx.save();
  ctx.globalAlpha = emphasisAlpha(tone, selected);
  const accent = afterAccentOf(equipment.type);
  const fill = emphasisFill(def.fill, tone, equipment.type);
  const stroke = emphasisStroke(def.stroke, tone, selected, equipment.type);
  const lineW = DrawView.printMode
    ? (selected ? 3.4 : (tone === "emphasis" ? 3 : 2))
    : (selected ? 2.8 : (tone === "emphasis" ? 2.4 : 1.4));
  if (equipment.shape === "circle" || equipment.type === "underground_tank") {
    const cx = p.x + size.w / 2;
    const cy = p.y + size.d / 2;
    if (tone === "emphasis" && !selected) {
      ctx.beginPath();
      ctx.ellipse(cx, cy, size.w / 2 + 3, size.d / 2 + 3, 0, 0, Math.PI * 2);
      ctx.strokeStyle = accent.glow;
      ctx.lineWidth = 4;
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.ellipse(cx, cy, size.w / 2, size.d / 2, 0, 0, Math.PI * 2);
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.strokeStyle = stroke;
    ctx.lineWidth = lineW;
    ctx.stroke();
  } else {
    if (tone === "emphasis" && !selected) {
      roundRect(ctx, p.x - 2.5, p.y - 2.5, size.w + 5, size.d + 5, 4);
      ctx.strokeStyle = accent.glow;
      ctx.lineWidth = 4;
      ctx.stroke();
    }
    roundRect(ctx, p.x, p.y, size.w, size.d, 3);
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.strokeStyle = stroke;
    ctx.lineWidth = lineW;
    ctx.stroke();
  }

  if (selected) {
    ctx.globalAlpha = 1;
    ctx.setLineDash([5, 4]);
    ctx.strokeStyle = accent.stroke;
    ctx.lineWidth = 1.2;
    ctx.strokeRect(p.x - 4, p.y - 4, size.w + 8, size.d + 8);
    ctx.setLineDash([]);
  }
  ctx.restore();
}

function pipeStrokeWidthPx(equipment) {
  const diameter = equipment.dimensions && equipment.dimensions.diameterMm;
  // 呼び径（25A など）は実寸のmmではないので、平面図で見分けやすい見かけ太さに変換する
  const nominal = diameter != null && diameter > 0 ? Number(diameter) : 40;
  const apparentMm = Math.max(80, nominal * 8);
  const px = apparentMm * (DrawView.scale || 0.012);
  return Math.max(2.5, Math.min(40, px));
}

function drawPipeBody(ctx, equipment, placement, selected, emphasis) {
  const def = equipmentTypeOf(equipment.type);
  const tone = emphasis === "emphasis" ? "emphasis" : "muted";
  const accent = afterAccentOf(equipment.type);
  const ends = pipeEndpoints(placement);
  const a = worldToScreen(ends.x1, ends.y1);
  const b = worldToScreen(ends.x2, ends.y2);
  const width = pipeStrokeWidthPx(equipment);
  ctx.save();
  ctx.globalAlpha = emphasisAlpha(tone, selected);
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  if (tone === "emphasis" && !selected) {
    ctx.strokeStyle = accent.glow;
    ctx.lineWidth = width + 5;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
  }
  ctx.strokeStyle = selected
    ? accent.stroke
    : emphasisStroke(def.stroke, tone, false, equipment.type);
  ctx.lineWidth = width + (selected ? 2.5 : (tone === "emphasis" ? 1.5 : 0));
  ctx.beginPath();
  ctx.moveTo(a.x, a.y);
  ctx.lineTo(b.x, b.y);
  ctx.stroke();
  ctx.strokeStyle = emphasisFill(def.fill, tone, equipment.type);
  ctx.lineWidth = Math.max(1.5, width * (tone === "emphasis" ? 0.68 : 0.5));
  ctx.beginPath();
  ctx.moveTo(a.x, a.y);
  ctx.lineTo(b.x, b.y);
  ctx.stroke();
  if (selected) {
    ctx.globalAlpha = 1;
    ctx.fillStyle = accent.stroke;
    ctx.beginPath();
    ctx.arc(a.x, a.y, 4, 0, Math.PI * 2);
    ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function drawPipeDraft(ctx, startMm, endMm) {
  if (!startMm || !endMm) {
    return;
  }
  const a = worldToScreen(startMm.xMm, startMm.yMm);
  const b = worldToScreen(endMm.xMm, endMm.yMm);
  ctx.save();
  ctx.setLineDash([6, 4]);
  ctx.strokeStyle = "#c45c26";
  ctx.lineWidth = Math.max(2, 40 * DrawView.scale);
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(a.x, a.y);
  ctx.lineTo(b.x, b.y);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = "#8a3d16";
  ctx.beginPath();
  ctx.arc(a.x, a.y, 3.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function siteClipRect(placement, fp) {
  const site = typeof SITE_WIDTH_MM !== "undefined"
    ? { widthMm: SITE_WIDTH_MM, depthMm: SITE_DEPTH_MM }
    : null;
  const siteA = worldToScreen(0, 0);
  const siteB = worldToScreen(
    site ? site.widthMm : placement.xMm + (fp.widthMm || 0),
    site ? site.depthMm : placement.yMm + (fp.depthMm || 0)
  );
  return {
    left: Math.min(siteA.x, siteB.x) + 2,
    top: Math.min(siteA.y, siteB.y) + 2,
    right: Math.max(siteA.x, siteB.x) - 2,
    bottom: Math.max(siteA.y, siteB.y) - 2
  };
}

function measureLabelSize(text, fontPx, rotated) {
  const approx = Math.max(12, String(text).length * fontPx * 0.62);
  const h = fontPx + 4;
  if (rotated) {
    return { w: h, h: approx };
  }
  return { w: approx, h: h };
}

function buildPlanLabels(doc) {
  const labels = [];
  pairedItems(doc).forEach((pair) => {
    collectEquipmentLabels(labels, pair.equipment, pair.placement);
  });
  return labels;
}

function collectEquipmentLabels(labels, equipment, placement) {
  if (isPipeType(equipment.type)) {
    collectPipeLabels(labels, equipment, placement);
    return;
  }
  const fp = footprintOf(equipment, placement);
  const w = fp.widthMm;
  const d = fp.depthMm;
  if (w == null || d == null || w <= 0 || d <= 0) {
    return;
  }
  const p = worldToScreen(placement.xMm, placement.yMm);
  const size = { w: w * DrawView.scale, d: d * DrawView.scale };
  const dims = equipment.dimensions || {};
  const clip = siteClipRect(placement, fp);
  const pad = Math.max(10, Math.min(16, Math.min(size.w, size.d) * 0.08));
  const fontPx = printLabelBoost(size.w < 70 || size.d < 70 ? 11 : 12);
  const nameRow = size.w >= 24 && size.d >= 18 ? fontPx + 6 : 0;
  const offsets = placement.labelOffsets || {};

  // 横寸法線＝上辺全体、縦寸法線＝左辺全体（寄せない）
  const edgeTop = {
    x0: p.x + 4,
    y0: p.y + pad + nameRow + fontPx + 2,
    x1: p.x + size.w - 4,
    y1: p.y + pad + nameRow + fontPx + 2
  };
  const edgeSide = {
    x0: p.x + pad + fontPx + 2,
    y0: p.y + 4,
    x1: p.x + pad + fontPx + 2,
    y1: p.y + size.d - 4
  };
  const edgeInner = {
    x0: p.x + size.w * 0.25,
    y0: p.y + size.d - pad,
    x1: p.x + size.w * 0.75,
    y1: p.y + size.d - pad
  };

  if (size.w >= 24 && size.d >= 18) {
    const def = equipmentTypeOf(equipment.type);
    const rawName = equipment.name || def.label;
    const maxChars = Math.max(2, Math.floor((size.w - 8) / (fontPx * 0.6)));
    const text = rawName.length > maxChars ? rawName.slice(0, maxChars) + "…" : rawName;
    pushLabel(labels, {
      placementId: placement.id,
      key: "name",
      text: text,
      fontPx: fontPx,
      bold: true,
      rotated: false,
      baseX: p.x + 4,
      baseY: p.y + 4,
      align: "left",
      baseline: "top",
      anchorX: p.x + 8,
      anchorY: p.y + 8,
      edge: null,
      offset: offsets.name || null,
      locked: !!(offsets.name)
    });
  }

  let topLabel = "";
  let sideLabel = "";
  let innerLabel = "";
  if (equipment.type === "road") {
    topLabel = formatMm(dims.lengthMm);
    sideLabel = formatMm(dims.widthMm);
  } else if (equipment.type === "underground_tank") {
    topLabel = formatMm(dims.lengthMm);
    sideLabel = formatMm(dims.diameterMm);
    if (dims.burialDepthMm != null) {
      innerLabel = "深さ " + formatMm(dims.burialDepthMm);
    }
  } else if (equipment.type === "bulk_2_9t" || equipment.type === "bulk_1t") {
    topLabel = "φ " + formatMm(dims.diameterMm);
    innerLabel = dims.heightMm != null ? "H " + formatMm(dims.heightMm) : "H 未確認";
  } else {
    topLabel = formatMm(fp.widthMm);
    sideLabel = formatMm(fp.depthMm);
    if (dims.heightMm != null) {
      innerLabel = "H " + formatMm(dims.heightMm);
    } else if (equipmentTypeOf(equipment.type).fields.some((f) => f.key === "heightMm")) {
      innerLabel = "H 未確認";
    }
  }

  if (topLabel && size.w >= 36) {
    pushLabel(labels, {
      placementId: placement.id,
      key: "top",
      text: topLabel,
      fontPx: fontPx,
      bold: false,
      rotated: false,
      baseX: clamp(p.x + size.w / 2, clip.left + 20, clip.right - 20),
      baseY: clamp(p.y + pad + nameRow, clip.top + fontPx, clip.bottom - fontPx),
      align: "center",
      baseline: "top",
      anchorX: (edgeTop.x0 + edgeTop.x1) / 2,
      anchorY: edgeTop.y0,
      edge: edgeTop,
      offset: offsets.top || null,
      locked: !!(offsets.top)
    });
  }

  if (sideLabel && size.d >= 36) {
    pushLabel(labels, {
      placementId: placement.id,
      key: "side",
      text: sideLabel,
      fontPx: fontPx,
      bold: false,
      rotated: true,
      baseX: clamp(p.x + pad, clip.left + fontPx, clip.right - fontPx),
      baseY: clamp(p.y + size.d / 2, clip.top + 20, clip.bottom - 20),
      align: "center",
      baseline: "top",
      anchorX: edgeSide.x0,
      anchorY: (edgeSide.y0 + edgeSide.y1) / 2,
      edge: edgeSide,
      offset: offsets.side || null,
      locked: !!(offsets.side)
    });
  }

  if (innerLabel && size.w >= 40 && size.d >= 40) {
    pushLabel(labels, {
      placementId: placement.id,
      key: "inner",
      text: innerLabel,
      fontPx: fontPx,
      bold: false,
      rotated: false,
      baseX: clamp(p.x + size.w / 2, clip.left + 20, clip.right - 20),
      baseY: clamp(p.y + size.d - pad, clip.top + fontPx, clip.bottom - 2),
      align: "center",
      baseline: "bottom",
      anchorX: (edgeInner.x0 + edgeInner.x1) / 2,
      anchorY: edgeInner.y0,
      edge: edgeInner,
      offset: offsets.inner || null,
      locked: !!(offsets.inner)
    });
  }
}

function pushLabel(labels, spec) {
  const scale = DrawView.scale || 0.012;
  const dxPx = spec.offset ? spec.offset.dxMm * scale : 0;
  const dyPx = spec.offset ? spec.offset.dyMm * scale : 0;
  const x = spec.baseX + dxPx;
  const y = spec.baseY + dyPx;
  const box = measureLabelSize(spec.text, spec.fontPx, spec.rotated);
  const rect = labelScreenRect(x, y, box.w, box.h, spec.align, spec.baseline, spec.rotated);
  labels.push(Object.assign({}, spec, {
    x: x,
    y: y,
    autoDxPx: 0,
    autoDyPx: 0,
    boxW: box.w,
    boxH: box.h,
    left: rect.left,
    top: rect.top,
    right: rect.right,
    bottom: rect.bottom
  }));
}

function labelScreenRect(x, y, w, h, align, baseline, rotated) {
  let left = x;
  let top = y;
  if (!rotated) {
    if (align === "center") {
      left = x - w / 2;
    } else if (align === "right") {
      left = x - w;
    }
    if (baseline === "middle") {
      top = y - h / 2;
    } else if (baseline === "bottom") {
      top = y - h;
    }
  } else {
    left = x - w / 2;
    top = y - h / 2;
  }
  return { left: left, top: top, right: left + w, bottom: top + h };
}

function syncLabelRect(label) {
  const rect = labelScreenRect(
    label.x + label.autoDxPx,
    label.y + label.autoDyPx,
    label.boxW,
    label.boxH,
    label.align,
    label.baseline,
    label.rotated
  );
  label.left = rect.left;
  label.top = rect.top;
  label.right = rect.right;
  label.bottom = rect.bottom;
}

function labelsOverlap(a, b, pad) {
  const p = pad == null ? 2 : pad;
  return !(a.right + p <= b.left || b.right + p <= a.left || a.bottom + p <= b.top || b.bottom + p <= a.top);
}

function resolveLabelCollisions(labels) {
  const dirs = [
    { dx: 0, dy: -14 },
    { dx: 14, dy: 0 },
    { dx: 0, dy: 14 },
    { dx: -14, dy: 0 },
    { dx: 12, dy: -12 },
    { dx: 12, dy: 12 },
    { dx: -12, dy: 12 },
    { dx: -12, dy: -12 }
  ];
  for (let pass = 0; pass < 8; pass += 1) {
    let moved = false;
    for (let i = 0; i < labels.length; i += 1) {
      const a = labels[i];
      for (let j = 0; j < i; j += 1) {
        const b = labels[j];
        syncLabelRect(a);
        syncLabelRect(b);
        if (!labelsOverlap(a, b, 3)) {
          continue;
        }
        const target = a.locked && !b.locked ? b : (!a.locked ? a : (b.locked ? a : b));
        const other = target === a ? b : a;
        let best = null;
        for (let d = 0; d < dirs.length; d += 1) {
          const trial = {
            left: target.left + dirs[d].dx,
            top: target.top + dirs[d].dy,
            right: target.right + dirs[d].dx,
            bottom: target.bottom + dirs[d].dy
          };
          if (!labelsOverlap(trial, other, 3)) {
            best = dirs[d];
            break;
          }
        }
        if (!best) {
          best = dirs[pass % dirs.length];
        }
        target.autoDxPx += best.dx;
        target.autoDyPx += best.dy;
        syncLabelRect(target);
        moved = true;
      }
    }
    if (!moved) {
      break;
    }
  }
  labels.forEach(syncLabelRect);
}

function drawPlanLabel(ctx, label, selected, emphasis, equipmentType) {
  const tone = emphasis === "emphasis" ? "emphasis" : "muted";
  const typeKey = equipmentType || "other";
  const accent = afterAccentOf(typeKey);
  const pastel = beforePastelOf(typeKey);
  const drawX = label.x + label.autoDxPx;
  const drawY = label.y + label.autoDyPx;
  const moved = Math.abs(drawX - label.baseX) > 1.5 || Math.abs(drawY - label.baseY) > 1.5;
  const print = !!DrawView.printMode;

  ctx.save();
  // 文字・数字はビフォア／アフターともはっきり見せる（設備本体の薄さとは分ける）
  ctx.globalAlpha = 1;

  if (label.edge) {
    drawEdgeTicks(ctx, label.edge.x0, label.edge.y0, label.edge.x1, label.edge.y1);
  }

  if (moved || label.locked) {
    drawLeaderLine(ctx, label, drawX, drawY, selected || tone === "emphasis" || print, accent);
  }

  const fontPx = print
    ? Math.max(18, (label.fontPx || 12) + 2)
    : Math.max(11, (label.fontPx || 11) + 1);
  ctx.font = ((selected || tone === "emphasis" || label.bold || print) ? "700 " : "650 ") +
    fontPx + "px Yu Gothic UI, Meiryo, sans-serif";
  // 印刷は黒い文字を優先。画面のビフォアはパステル系の区分色
  if (print) {
    ctx.fillStyle = selected || tone === "emphasis" ? mixHex(accent.label, "#000000", 0.35) : "#111418";
  } else if (selected || tone === "emphasis") {
    ctx.fillStyle = accent.label;
  } else {
    ctx.fillStyle = pastel.label;
  }
  ctx.strokeStyle = "rgba(255, 255, 255, 0.98)";
  ctx.lineWidth = print ? 5.5 : (selected || tone === "emphasis" ? 4 : 3.5);
  if (label.rotated) {
    ctx.translate(drawX, drawY);
    ctx.rotate(-Math.PI / 2);
    ctx.textAlign = "center";
    ctx.textBaseline = "top";
    strokeFillText(ctx, label.text, 0, 0);
  } else {
    ctx.textAlign = label.align;
    ctx.textBaseline = label.baseline;
    strokeFillText(ctx, label.text, drawX, drawY);
  }
  ctx.restore();
}

function drawLeaderLine(ctx, label, drawX, drawY, strong, accent) {
  const toX = label.anchorX;
  const toY = label.anchorY;
  let fromX = drawX;
  let fromY = drawY;
  if (!label.rotated) {
    if (label.align === "left") {
      fromX = drawX + Math.min(10, label.boxW / 2);
    }
    if (label.baseline === "top") {
      fromY = drawY + label.fontPx;
    } else if (label.baseline === "bottom") {
      fromY = drawY - 2;
    }
  }
  const stroke = strong && accent
    ? accent.stroke
    : "rgba(26, 30, 36, 0.75)";
  const fill = strong && accent
    ? accent.stroke
    : "rgba(26, 30, 36, 0.85)";
  ctx.save();
  ctx.globalAlpha = 1;
  ctx.strokeStyle = stroke;
  ctx.lineWidth = strong ? 1.5 : 1.2;
  ctx.setLineDash([3, 3]);
  ctx.beginPath();
  ctx.moveTo(fromX, fromY);
  ctx.lineTo(toX, toY);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.beginPath();
  ctx.arc(toX, toY, 2.2, 0, Math.PI * 2);
  ctx.fillStyle = fill;
  ctx.fill();
  ctx.restore();
}

function strokeFillText(ctx, text, x, y) {
  // 白い縁取りを厚めにして、図面の上でも文字が沈まないようにする
  ctx.strokeText(text, x, y);
  ctx.strokeText(text, x, y);
  ctx.fillText(text, x, y);
}

function drawEdgeTicks(ctx, x0, y0, x1, y1) {
  ctx.save();
  ctx.strokeStyle = DrawView.printMode ? "rgba(17, 20, 24, 0.92)" : "rgba(26, 30, 36, 0.78)";
  ctx.lineWidth = DrawView.printMode ? 2 : 1.25;
  ctx.beginPath();
  ctx.moveTo(x0, y0);
  ctx.lineTo(x1, y1);
  ctx.stroke();
  const dx = x1 - x0;
  const dy = y1 - y0;
  const len = Math.sqrt(dx * dx + dy * dy) || 1;
  const px = (-dy / len) * 4;
  const py = (dx / len) * 4;
  ctx.beginPath();
  ctx.moveTo(x0 - px, y0 - py);
  ctx.lineTo(x0 + px, y0 + py);
  ctx.moveTo(x1 - px, y1 - py);
  ctx.lineTo(x1 + px, y1 + py);
  ctx.stroke();
  ctx.restore();
}

function hitTestLabel(xPx, yPx) {
  const list = DrawView._labelHitList || [];
  for (let i = list.length - 1; i >= 0; i -= 1) {
    const label = list[i];
    if (xPx >= label.left - 2 && xPx <= label.right + 2 && yPx >= label.top - 2 && yPx <= label.bottom + 2) {
      return label;
    }
  }
  return null;
}

function distancePointToSegmentMm(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1;
  const dy = y2 - y1;
  const len2 = dx * dx + dy * dy;
  if (len2 <= 0) {
    return Math.hypot(px - x1, py - y1);
  }
  let t = ((px - x1) * dx + (py - y1) * dy) / len2;
  t = Math.max(0, Math.min(1, t));
  const qx = x1 + dx * t;
  const qy = y1 + dy * t;
  return Math.hypot(px - qx, py - qy);
}

function collectPipeLabels(labels, equipment, placement) {
  const ends = pipeEndpoints(placement);
  const length = pipeLengthMm(placement);
  if (length < MOVE_STEP_MM) {
    return;
  }
  const a = worldToScreen(ends.x1, ends.y1);
  const b = worldToScreen(ends.x2, ends.y2);
  const mx = (a.x + b.x) / 2;
  const my = (a.y + b.y) / 2;
  const fontPx = printLabelBoost(12);
  const offsets = placement.labelOffsets || {};
  const dims = equipment.dimensions || {};
  const def = equipmentTypeOf(equipment.type);
  pushLabel(labels, {
    placementId: placement.id,
    key: "name",
    text: equipment.name || def.label,
    fontPx: fontPx,
    bold: true,
    rotated: false,
    baseX: mx,
    baseY: my - 14,
    align: "center",
    baseline: "bottom",
    anchorX: mx,
    anchorY: my,
    edge: null,
    offset: offsets.name || null,
    locked: !!(offsets.name)
  });
  pushLabel(labels, {
    placementId: placement.id,
    key: "top",
    text: "L " + formatMm(length),
    fontPx: fontPx,
    bold: false,
    rotated: false,
    baseX: mx,
    baseY: my + 4,
    align: "center",
    baseline: "top",
    anchorX: mx,
    anchorY: my,
    edge: { x0: a.x, y0: a.y, x1: b.x, y1: b.y },
    offset: offsets.top || null,
    locked: !!(offsets.top)
  });
  if (dims.diameterMm != null) {
    pushLabel(labels, {
      placementId: placement.id,
      key: "inner",
      text: String(dims.diameterMm) + "A",
      fontPx: fontPx,
      bold: false,
      rotated: false,
      baseX: mx,
      baseY: my + 18,
      align: "center",
      baseline: "top",
      anchorX: mx,
      anchorY: my,
      edge: null,
      offset: offsets.inner || null,
      locked: !!(offsets.inner)
    });
  }
}

function hitTest(doc, xPx, yPx) {
  const world = screenToWorld(xPx, yPx);
  const pairs = pairedItems(doc).slice().reverse();
  for (let i = 0; i < pairs.length; i += 1) {
    const { equipment, placement } = pairs[i];
    if (isPipeType(equipment.type)) {
      const ends = pipeEndpoints(placement);
      const diameter = equipment.dimensions && equipment.dimensions.diameterMm;
      const nominal = diameter != null && diameter > 0 ? Number(diameter) : 40;
      const hitMm = Math.max(120, nominal * 4 + 80);
      if (distancePointToSegmentMm(world.xMm, world.yMm, ends.x1, ends.y1, ends.x2, ends.y2) <= hitMm) {
        return placement;
      }
      continue;
    }
    const fp = footprintOf(equipment, placement);
    if (fp.widthMm == null || fp.depthMm == null) {
      continue;
    }
    if (equipment.shape === "circle" || equipment.type === "underground_tank") {
      const cx = placement.xMm + fp.widthMm / 2;
      const cy = placement.yMm + fp.depthMm / 2;
      const nx = (world.xMm - cx) / (fp.widthMm / 2);
      const ny = (world.yMm - cy) / (fp.depthMm / 2);
      if (nx * nx + ny * ny <= 1) {
        return placement;
      }
    } else if (
      world.xMm >= placement.xMm &&
      world.xMm <= placement.xMm + fp.widthMm &&
      world.yMm >= placement.yMm &&
      world.yMm <= placement.yMm + fp.depthMm
    ) {
      return placement;
    }
  }
  return null;
}

function roundRect(ctx, x, y, w, h, r) {
  const radius = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + radius, y);
  ctx.arcTo(x + w, y, x + w, y + h, radius);
  ctx.arcTo(x + w, y + h, x, y + h, radius);
  ctx.arcTo(x, y + h, x, y, radius);
  ctx.arcTo(x, y, x + w, y, radius);
  ctx.closePath();
}

  <script>
/* A4 landscape PDF with the existing high-resolution print canvas.
 * No external libraries or network access required. */
function createPlanPdf(canvas) {
  const encoded = canvas.toDataURL("image/jpeg", 0.98).split(",")[1];
  const raw = atob(encoded);
  const jpeg = Uint8Array.from(raw, (c) => c.charCodeAt(0));
  const encoder = new TextEncoder();
  const parts = [];
  const offsets = [0];
  let length = 0;
  function append(value) {
    const bytes = typeof value === "string" ? encoder.encode(value) : value;
    parts.push(bytes);
    length += bytes.length;
  }
  function object(number, content) {
    offsets[number] = length;
    append(number + " 0 obj\n" + content + "\nendobj\n");
  }
  append("%PDF-1.4\n");
  object(1, "<< /Type /Catalog /Pages 2 0 R >>");
  object(2, "<< /Type /Pages /Kids [3 0 R] /Count 1 >>");
  object(3, "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 841.89 595.28] /Resources << /XObject << /Plan 4 0 R >> >> /Contents 5 0 R >>");
  offsets[4] = length;
  append("4 0 obj\n<< /Type /XObject /Subtype /Image /Width " + canvas.width +
    " /Height " + canvas.height + " /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length " + jpeg.length + " >>\nstream\n");
  append(jpeg);
  append("\nendstream\nendobj\n");
  const commands = "q\n841.89 0 0 595.28 0 0 cm\n/Plan Do\nQ\n";
  object(5, "<< /Length " + encoder.encode(commands).length + " >>\nstream\n" + commands + "endstream");
  const xref = length;
  append("xref\n0 6\n0000000000 65535 f \n");
  for (let i = 1; i <= 5; i++) append(String(offsets[i]).padStart(10, "0") + " 00000 n \n");
  append("trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n" + xref + "\n%%EOF\n");
  return new Blob(parts, { type: "application/pdf" });
}

  function cloneProject(source) {

  function pushHistory() {

  function updateHistoryButtons() {

  function undoChange() {

    historyFuture.push(cloneProject(project));
    project = historyPast.pop();
    if (!project.meta) {
      project.meta = emptyMeta();

    pruneSelection();

    persist();
    refresh();
    updateHistoryButtons();
    updatePageChrome();
    setMessage("戻しました。");
  }

  function redoChange() {
    if (!isEditablePage() || !historyFuture.length) {
      return;
    }
    historyPast.push(cloneProject(project));
    if (historyPast.length > HISTORY_LIMIT) {
      historyPast.shift();
    }
    project = historyFuture.pop();
    if (!project.meta) {
      project.meta = emptyMeta();
    }
    bindActivePage(false);
    pruneSelection();
    applySheetInfoToForm();
    persist();
    refresh();
    updateHistoryButtons();
    updatePageChrome();
    setMessage("やり直しました。");
  }

  function switchPage(page) {
    if (page === PAGE_AFTER && !hasAfterPage(project)) {
      createAfterPage();
      return;
    }
    if (page === PAGE_COMPARE && !hasAfterPage(project)) {
      setMessage("先にアフターをコピー作成してください。");
      return;
    }
    if (project.activePage === page) {
      return;
    }
    if (isEditablePage()) {
      snapshotEditView();
    }
    let mirror = { added: 0, mirrored: 0, removed: 0 };
    if ((page === PAGE_AFTER || page === PAGE_COMPARE) && hasAfterPage(project)) {
      mirror = mirrorBeforeToAfter(project);
    }
    project.activePage = page;
    // ページ切替では履歴を消さない（誤って作り直したあと「戻る」で復元できるようにする）
    bindActivePage(false);
    if (isEditablePage()) {
      restoreEditView();
    }
    persist();
    refresh();
    updatePageChrome();
    if (page === PAGE_COMPARE) {
      compareView.needFit = true;
    }
    if (page === PAGE_BEFORE) {
      setMessage("ビフォア（現状）を表示しています。");
    } else if (page === PAGE_AFTER) {
      setMessage(describeMirrorResult(mirror, "アフターを表示しています。削除・移動・追加はアフター側の操作として残ります。"));
    } else {
      setMessage(describeMirrorResult(mirror, "左右比較：同じ拡大で全体表示しています。拡大・全体・矢印は左右共通です。"));
    }
  }

  function describeMirrorResult(mirror, fallback) {
    const parts = [];
    if (mirror && mirror.added > 0) {
      parts.push("追加" + mirror.added + "件");
    }
    if (mirror && mirror.mirrored > 0) {
      parts.push("映し出し" + mirror.mirrored + "件");
    }
    if (mirror && mirror.removed > 0) {
      parts.push("削除反映" + mirror.removed + "件");
    }
    if (!parts.length) {
      return fallback;
    }
    return "ビフォアをアフターへ反映しました（" + parts.join("・") + "）。";
  }

  function createAfterPage() {
    if (hasAfterPage(project)) {
      switchPage(PAGE_AFTER);
      setMessage("アフターは既にあります。ビフォアで増やした設備は自動で追記されます。");
      return;
    }
    pushHistory();
    createAfterFromBefore(project);
    project.activePage = PAGE_AFTER;
    bindActivePage(false);
    historyFuture = [];
    updateHistoryButtons();
    restoreEditView();
    persist();
    refresh();
    updatePageChrome();
    setMessage("アフターを作成しました。ここから削除・追加できます。ビフォアへ追加した設備は自動で追記されます。");
  }

  function updatePaletteColors() {
    const tone = project.activePage === PAGE_AFTER ? "emphasis" : "muted";
    paletteEl.querySelectorAll(".palette-btn").forEach((button) => {
      const def = equipmentTypeOf(button.dataset.type);
      const fill = emphasisFill(def.fill, tone, def.type);
      // Match the unselected canvas equipment, including its opacity on white.
      button.style.setProperty("--equipment-fill", tone === "muted" ? mixHexWithWhite(fill, 0.1) : fill);
      button.style.setProperty("--equipment-stroke", emphasisStroke(def.stroke, tone, false, def.type));
    });
  }

  function updatePageChrome() {
    updatePaletteColors();
    const hasAfter = hasAfterPage(project);
    const compare = isCompareMode();
    document.getElementById("pageBefore").setAttribute("aria-pressed", project.activePage === PAGE_BEFORE ? "true" : "false");
    document.getElementById("pageAfter").setAttribute("aria-pressed", project.activePage === PAGE_AFTER ? "true" : "false");
    document.getElementById("pageCompare").setAttribute("aria-pressed", compare ? "true" : "false");
    document.getElementById("pageCompare").disabled = !hasAfter;
    document.getElementById("copyAfterButton").hidden = hasAfter;
    document.getElementById("copyAfterButton").textContent = "Copy";
    compareStage.hidden = !compare;
    stageWrap.classList.toggle("is-compare", compare);
    appRoot.classList.toggle("is-compare", compare);
    canvas.style.visibility = compare ? "hidden" : "visible";
  }

  function primarySelectedId() {
    const first = selectedPlacementIds.values().next();
    return first.done ? null : first.value;
  }

  function selectedPlacements() {
    return Array.from(selectedPlacementIds)
      .map((id) => findPlacement(doc, id))
      .filter(Boolean);
  }

  function setSelection(ids) {
    selectedPlacementIds = new Set(ids.filter(Boolean));
  }

  function selectRelated(placementId, additive) {
    const group = findGroupByPlacement(doc, placementId);
    if (additive) {
      if (selectedPlacementIds.has(placementId)) {
        selectedPlacementIds.delete(placementId);
      } else {
        selectedPlacementIds.add(placementId);
      }
      return;
    }
    if (group) {
      setSelection(group.placementIds.slice());
    } else {
      setSelection([placementId]);
    }
  }

  function closeDimensionDialogCanceled() {
    pendingType = null;
    placing = false;
    pipeStart = null;
    pipeHover = null;
    placePendingAt._lastValues = null;
    clearPalettePressed();
    setMessage("");
    canvas.style.cursor = "grab";
    if (dimDialog.open) {
      dimDialog.close("cancel");
    }
  }

  function confirmDimensionDialog() {
    if (!pendingType) {
      return false;
    }
    const values = readDialogValues();
    const missing = requiredDimsPresent(pendingType, values);
    if (!values.name) {
      setMessage("名称を入力してください。");
      return false;
    }
    if (missing.length) {
      setMessage("必須寸法が未入力です: " + missing.join("、"));
      return false;
    }
    placePendingAt._lastValues = values;
    dimDialog.returnValue = "ok";
    dimDialog.close("ok");
    placing = true;
    pipeStart = null;
    pipeHover = null;
    if (isLinePlaceType(pendingType)) {
      setMessage("始点をクリックしてください。やめるときは Esc。");
    } else {
      setMessage("作図エリアをクリックして配置位置を決めてください。");
    }
    canvas.style.cursor = "crosshair";
    return true;
  }

  function bindCanvas() {
    canvas.addEventListener("pointerdown", onPointerDown);
    canvas.addEventListener("pointermove", onPointerMove);
    canvas.addEventListener("pointerup", onPointerUp);
    canvas.addEventListener("pointercancel", onPointerUp);
    canvas.addEventListener("wheel", (event) => {
      event.preventDefault();
      if (isCompareMode()) {
        return;
      }
      const factor = event.deltaY < 0 ? 1.12 : 0.9;
      const rect = canvas.getBoundingClientRect();
      zoomAt(canvas, factor, event.clientX - rect.left, event.clientY - rect.top);
      snapshotEditView();
      refresh();
    }, { passive: false });

    [canvasBefore, canvasAfter].forEach((target) => {
      target.addEventListener("wheel", (event) => {
        if (!isCompareMode()) {
          return;
        }
        event.preventDefault();
        const factor = event.deltaY < 0 ? 1.12 : 0.9;
        const rect = target.getBoundingClientRect();
        zoomCompareAt(factor, event.clientX - rect.left, event.clientY - rect.top);
        refresh();
      }, { passive: false });
      target.addEventListener("pointerdown", (event) => {
        if (!isCompareMode() || event.button !== 0) {
          return;
        }
        target.setPointerCapture(event.pointerId);
        const rect = target.getBoundingClientRect();
        compareView.pan = {
          x: event.clientX - rect.left,
          y: event.clientY - rect.top,
          ox: compareView.offsetX,
          oy: compareView.offsetY
        };
        target.style.cursor = "grabbing";
      });
      target.addEventListener("pointermove", (event) => {
        if (!compareView.pan) {
          return;
        }
        const rect = target.getBoundingClientRect();
        const x = event.clientX - rect.left;
        const y = event.clientY - rect.top;
        compareView.offsetX = compareView.pan.ox + (x - compareView.pan.x);
        compareView.offsetY = compareView.pan.oy + (y - compareView.pan.y);
        refresh();
      });
      target.addEventListener("pointerup", () => {
        compareView.pan = null;
        target.style.cursor = "grab";
      });
      target.addEventListener("pointercancel", () => {
        compareView.pan = null;
        target.style.cursor = "grab";
      });
    });
  }

  function openDimensionDialog(type) {
    if (!isEditablePage()) {
      setMessage("比較表示中は編集できません。ビフォアまたはアフターを選んでください。");
      return;
    }
    pendingType = type;
    placing = false;
    clearPalettePressed();
    const btn = paletteEl.querySelector(`[data-type="${type}"]`);
    if (btn) {
      btn.setAttribute("aria-pressed", "true");
    }
    const def = equipmentTypeOf(type);
    dialogTitle.textContent = def.label + "の寸法入力";
    dialogName.value = def.label;
    dialogFields.innerHTML = "";
    def.fields.forEach((field) => {
      dialogFields.appendChild(buildField(field, ""));
    });
    const note = dimDialog.querySelector(".dialog-note");
    if (note) {
      note.textContent = isLinePlaceType(type)
        ? "太さは数字のみ（例: 25）。Aは欄外に表示。空欄＝未確認。長さは始点〜終点から自動です。"
        : "空欄＝未確認（推測しません）";
    }
    otherShapeFields.hidden = !def.allowsCustomShape;
    if (def.allowsCustomShape) {
      dialogShape.value = "rect";
    }
    if (typeof dimDialog.showModal === "function") {
      dimDialog.showModal();
      const firstSize = dialogFields.querySelector("input");
      if (firstSize) {
        firstSize.focus();
        firstSize.select();
      }
    } else {
      setMessage("このブラウザはダイアログに対応していません。");
    }
  }

  function readDialogValues() {
    const values = { name: dialogName.value.trim() };
    const def = equipmentTypeOf(pendingType);
    def.fields.forEach((field) => {
      const input = document.getElementById("dlg_" + field.key);
      values[field.key] = input ? input.value : "";
    });
    if (def.allowsCustomShape) {
      values.shape = dialogShape.value;
    }
    return values;
  }

  function buildField(field, value) {
    const label = document.createElement("label");
    label.appendChild(document.createTextNode(shortDimLabel(field)));
    if (field.key === "heightMm") {
      label.classList.add("field-height");
    }
    const input = document.createElement("input");
    input.id = "dlg_" + field.key;
    input.type = "text";
    input.inputMode = "numeric";
    input.autocomplete = "off";
    input.title = field.unitSuffix
      ? (field.label + "（数字のみ。" + field.unitSuffix + "は欄外）" + (field.required ? "" : "／未確認可"))
      : (field.label + (field.required ? "" : "（任意・未確認可）"));
    input.placeholder = field.unitSuffix
      ? "例: 25"
      : (field.key === "heightMm"
        ? "未確認可"
        : (field.required ? "mm" : "未確認"));
    input.value = value == null || value === "" ? "" : String(value);
    // required は付けない（やめる時にブラウザの未入力警告が出ないようにする）
    if (field.unitSuffix) {
      const row = document.createElement("span");
      row.className = "unit-input-row";
      row.appendChild(input);
      const suffix = document.createElement("span");
      suffix.className = "unit-suffix";
      suffix.textContent = field.unitSuffix;
      row.appendChild(suffix);
      label.appendChild(row);
    } else {
      label.appendChild(input);
    }
    return label;
  }

  function shortDimLabel(field) {
    if (field && field.unitSuffix === "A") {
      return "太さ";
    }
    const map = {
      widthMm: "幅",
      depthMm: "奥行",
      heightMm: "高さ",
      lengthMm: "長さ",
      diameterMm: "直径",
      burialDepthMm: "深さ"
    };
    return map[field.key] || String(field.label || "").replace("（mm）", "");
  }

  function placePendingAt(xMm, yMm) {
    const type = pendingType;
    const cached = placePendingAt._lastValues;
    if (!type || !cached) {
      return;
    }
    pushHistory();
    const equipment = createEquipment(type, cached);
    const placement = createPlacement(equipment.id, xMm, yMm);
    clampPlacementToSite(placement, equipment, doc.site);
    doc.equipment.push(equipment);
    doc.drawing.placements.push(placement);
    setSelection([placement.id]);
    pendingType = null;
    placing = false;
    pipeStart = null;
    pipeHover = null;
    placePendingAt._lastValues = null;
    clearPalettePressed();
    canvas.style.cursor = "grab";
    let mirror = null;
    if (isEditingBeforePage() && hasAfterPage(project)) {
      mirror = mirrorBeforeToAfter(project);
    }
    persist();
    refresh();
    setMessage(mirror && mirror.added > 0
      ? equipment.name + " を配置し、アフターにも映し出しました。"
      : equipment.name + " を配置しました。");
  }

  function handlePipePlaceClick(xMm, yMm) {
    const type = pendingType;
    const cached = placePendingAt._lastValues;
    if (!type || !cached || !isLinePlaceType(type)) {
      return;
    }
    const point = { xMm: snapMm(xMm), yMm: snapMm(yMm) };
    if (!pipeStart) {
      pipeStart = point;
      pipeHover = point;
      setMessage("終点をクリックしてください。やめるときは Esc。");
      refresh();
      return;
    }
    const length = Math.round(Math.hypot(point.xMm - pipeStart.xMm, point.yMm - pipeStart.yMm));
    if (length < MOVE_STEP_MM) {
      setMessage("始点と終点が近すぎます。もう一度終点をクリックしてください。");
      return;
    }
    pushHistory();
    const equipment = createEquipment(type, cached);
    const placement = createPipePlacement(equipment.id, pipeStart.xMm, pipeStart.yMm, point.xMm, point.yMm);
    clampPlacementToSite(placement, equipment, doc.site);
    syncPipeDimensions(equipment, placement);
    doc.equipment.push(equipment);
    doc.drawing.placements.push(placement);
    setSelection([placement.id]);
    pendingType = null;
    placing = false;
    pipeStart = null;
    pipeHover = null;
    placePendingAt._lastValues = null;
    clearPalettePressed();
    canvas.style.cursor = "grab";
    let mirror = null;
    if (isEditingBeforePage() && hasAfterPage(project)) {
      mirror = mirrorBeforeToAfter(project);
    }
    persist();
    refresh();
    const dia = equipment.dimensions.diameterMm;
    const sizeText = "長さ " + formatMm(equipment.dimensions.lengthMm) +
      "／太さ " + (dia != null ? dia + "A" : "未確認");
    setMessage(mirror && mirror.added > 0
      ? equipment.name + " を配置し、アフターにも映し出しました（" + sizeText + "）。"
      : equipment.name + " を配置しました（" + sizeText + "）。");
  }

  function cancelPipeDraft() {
    if (!placing && !pipeStart) {
      return false;
    }
    pendingType = null;
    placing = false;
    pipeStart = null;
    pipeHover = null;
    placePendingAt._lastValues = null;
    clearPalettePressed();
    canvas.style.cursor = "grab";
    setMessage("配管の配置をやめました。");
    refresh();
    return true;
  }

  function onPointerDown(event) {
    if (!isEditablePage() || !doc) {
      return;
    }
    const pos = pointerPos(event);
    canvas.setPointerCapture(event.pointerId);

    if (placing && pendingType) {
      const world = screenToWorld(pos.x, pos.y);
      if (isLinePlaceType(pendingType)) {
        handlePipePlaceClick(world.xMm, world.yMm);
      } else {
        placePendingAt(world.xMm, world.yMm);
      }
      return;
    }

    // 中クリック／Alt＋ドラッグで図面を移動
    if (event.button === 1 || event.altKey) {
      startPan(pos);
      return;
    }

    // 寸法・名称ラベルを優先して掴む（手動で逃がせる）
    const labelHit = hitTestLabel(pos.x, pos.y);
    if (labelHit) {
      const now = Date.now();
      if (
        lastLabelClick &&
        lastLabelClick.placementId === labelHit.placementId &&
        lastLabelClick.key === labelHit.key &&
        now - lastLabelClick.at < 400
      ) {
        // ダブルクリックでそのラベル位置をリセット
        const placement = findPlacement(doc, labelHit.placementId);
        if (placement) {
          pushHistory();
          setLabelOffset(placement, labelHit.key, 0, 0);
          persist();
          setMessage("ラベル位置を戻しました。");
        }
        lastLabelClick = null;
        labelDrag = null;
        refresh();
        return;
      }
      lastLabelClick = { placementId: labelHit.placementId, key: labelHit.key, at: now };
      selectRelated(labelHit.placementId, event.shiftKey);
      if (!event.shiftKey) {
        const scale = DrawView.scale || 0.012;
        pushHistory();
        labelDrag = {
          placementId: labelHit.placementId,
          key: labelHit.key,
          startX: pos.x,
          startY: pos.y,
          originDxMm: (labelHit.x + labelHit.autoDxPx - labelHit.baseX) / scale,
          originDyMm: (labelHit.y + labelHit.autoDyPx - labelHit.baseY) / scale,
          moved: false
        };
        canvas.style.cursor = "grabbing";
      }
      refresh();
      return;
    }

    const hit = hitTest(doc, pos.x, pos.y);
    if (hit) {
      selectRelated(hit.id, event.shiftKey);
      if (!event.shiftKey && (activeTool === "move" || activeTool === "select")) {
        const world = screenToWorld(pos.x, pos.y);
        const moving = selectedPlacements();
        pushHistory();
        drag = {
          startX: world.xMm,
          startY: world.yMm,
          origins: moving.map((item) => ({
            id: item.id,
            xMm: item.xMm,
            yMm: item.yMm,
            endXMm: item.endXMm,
            endYMm: item.endYMm
          })),
          moved: false
        };
        canvas.style.cursor = "grabbing";
      }
      refresh();
      return;
    }

    if (!event.shiftKey) {
      setSelection([]);
    }
    startPan(pos);
    refresh();
  }

  function startPan(pos) {
    restoreEditView();
    pan = { x: pos.x, y: pos.y, ox: DrawView.offsetX, oy: DrawView.offsetY };
    canvas.style.cursor = "grabbing";
  }

  function onPointerMove(event) {
    const pos = pointerPos(event);
    if (placing && pendingType && isLinePlaceType(pendingType) && pipeStart) {
      const world = screenToWorld(pos.x, pos.y);
      pipeHover = { xMm: snapMm(world.xMm), yMm: snapMm(world.yMm) };
      refresh();
      return;
    }
    if (labelDrag) {
      const placement = findPlacement(doc, labelDrag.placementId);
      if (!placement) {
        return;
      }
      const scale = DrawView.scale || 0.012;
      const dxMm = labelDrag.originDxMm + (pos.x - labelDrag.startX) / scale;
      const dyMm = labelDrag.originDyMm + (pos.y - labelDrag.startY) / scale;
      if (Math.abs(pos.x - labelDrag.startX) > 2 || Math.abs(pos.y - labelDrag.startY) > 2) {
        labelDrag.moved = true;
      }
      setLabelOffset(placement, labelDrag.key, dxMm, dyMm);
      refresh();
      return;
    }
    if (drag) {
      const world = screenToWorld(pos.x, pos.y);
      const dx = world.xMm - drag.startX;
      const dy = world.yMm - drag.startY;
      const moving = drag.origins
        .map((origin) => {
          const placement = findPlacement(doc, origin.id);
          if (!placement) {
            return null;
          }
          placement.xMm = origin.xMm;
          placement.yMm = origin.yMm;
          if (origin.endXMm != null || origin.endYMm != null) {
            placement.endXMm = origin.endXMm;
            placement.endYMm = origin.endYMm;
          }
          return placement;
        })
        .filter(Boolean);
      if (dx !== 0 || dy !== 0) {
        drag.moved = true;
      }
      movePlacementsBy(doc, moving, dx, dy, doc.site);
      refresh();
      return;
    }
    if (pan) {
      DrawView.offsetX = pan.ox + (pos.x - pan.x);
      DrawView.offsetY = pan.oy + (pos.y - pan.y);
      snapshotEditView();
      refresh();
    }
  }

  function onPointerUp() {
    if (labelDrag) {
      if (!labelDrag.moved && historyPast.length) {
        historyPast.pop();
        updateHistoryButtons();
      } else if (labelDrag.moved) {
        persist();
        setMessage("ラベルを動かしました。点線が寸法の基準線につながります。");
      }
      labelDrag = null;
      refresh();
    }
    if (drag) {
      if (!drag.moved && historyPast.length) {
        // クリックだけで動かしていない場合は履歴を戻す
        historyPast.pop();
        updateHistoryButtons();
      } else if (drag.moved) {
        const moved = drag.origins
          .map((origin) => findPlacement(doc, origin.id))
          .filter(Boolean);
        if (project.activePage === PAGE_AFTER) {
          detachAfterPlacements(moved);
          persist();
          setMessage("アフターで移動しました。この設備はビフォアの変更に追従しません。");
        } else if (isEditingBeforePage() && hasAfterPage(project)) {
          const mirror = mirrorBeforeToAfter(project);
          persist();
          setMessage(mirror.mirrored > 0
            ? "ビフォアを移動し、追従中のアフター設備へ映し出しました。"
            : "ビフォアを移動しました。");
        } else {
          persist();
        }
      }
      drag = null;
      refresh();
    }
    if (pan) {
      snapshotEditView();
      pan = null;
    }
    canvas.style.cursor = "grab";
  }

  function resetSelectedLabels() {
    const ids = Array.from(selectedPlacementIds);
    if (!ids.length) {
      setMessage("設備を選んでからリセットしてください。");
      return;
    }
    pushHistory();
    ids.forEach((id) => {
      const placement = findPlacement(doc, id);
      if (placement) {
        clearLabelOffsets(placement);
      }
    });
    persist();
    refresh();
    setMessage("選択中のラベル位置を初期位置に戻しました。");
  }

  function pointerPos(event) {
    const rect = canvas.getBoundingClientRect();
    return { x: event.clientX - rect.left, y: event.clientY - rect.top };
  }

  function setTool(tool) {
    activeTool = tool;
    document.getElementById("toolSelect").setAttribute("aria-pressed", tool === "select" ? "true" : "false");
    document.getElementById("toolMove").setAttribute("aria-pressed", tool === "move" ? "true" : "false");
    canvas.style.cursor = "grab";
  }

  function panView(dxPx, dyPx) {
    if (isCompareMode()) {
      compareView.offsetX += dxPx;
      compareView.offsetY += dyPx;
      refresh();
      return;
    }
    DrawView.offsetX += dxPx;
    DrawView.offsetY += dyPx;
    snapshotEditView();
    refresh();
  }

  function nudge(dx, dy) {
    if (!isEditablePage()) {
      return;
    }
    const moving = selectedPlacements();
    if (!moving.length) {
      return;
    }
    pushHistory();
    movePlacementsBy(doc, moving, dx, dy, doc.site);
    if (project.activePage === PAGE_AFTER) {
      detachAfterPlacements(moving);
      persist();
      refresh();
      setMessage("アフターで移動しました。この設備はビフォアの変更に追従しません。");
      return;
    }
    if (isEditingBeforePage() && hasAfterPage(project)) {
      const mirror = mirrorBeforeToAfter(project);
      persist();
      refresh();
      setMessage(mirror.mirrored > 0
        ? "ビフォアを移動し、追従中のアフター設備へ映し出しました。"
        : "ビフォアを移動しました。");
      return;
    }
    persist();
    refresh();
  }

  function copySelected() {
    if (!isEditablePage() || !doc) {
      setMessage("比較表示中はコピーできません。");
      return;
    }
    const ids = Array.from(selectedPlacementIds);
    if (!ids.length) {
      setMessage("コピーする設備を選んでください。");
      return;
    }
    const captured = captureClipboard(doc, ids);
    if (!captured) {
      setMessage("コピーできませんでした。");
      return;
    }
    clipboard = captured;
    clipboardPasteCount = 0;
    updateClipboardButtons();
    setMessage(captured.items.length + "件をコピーしました。Ctrl+V または「貼り付け」で置けます。");
  }

  function pasteClipboard() {
    if (!isEditablePage() || !doc) {
      setMessage("比較表示中は貼り付けできません。");
      return;
    }
    if (!clipboard || !clipboard.items || !clipboard.items.length) {
      setMessage("先に設備をコピーしてください。");
      return;
    }
    pushHistory();
    clipboardPasteCount += 1;
    const result = pasteClipboardIntoDoc(doc, clipboard, clipboardPasteCount);
    if (!result || !result.count) {
      historyPast.pop();
      updateHistoryButtons();
      clipboardPasteCount = Math.max(0, clipboardPasteCount - 1);
      setMessage("貼り付けできませんでした。");
      return;
    }
    setSelection(result.placements.map((item) => item.id));
    if (project.activePage === PAGE_AFTER) {
      persist();
      refresh();
      setMessage(result.count + "件をアフターに貼り付けました。");
      return;
    }
    if (isEditingBeforePage() && hasAfterPage(project)) {
      const mirror = mirrorBeforeToAfter(project);
      persist();
      refresh();
      setMessage(result.count + "件を貼り付けました" +
        (mirror.added > 0 ? "（アフターにも映し出し）。" : "。"));
      return;
    }
    persist();
    refresh();
    setMessage(result.count + "件を貼り付けました。");
  }

  function updateClipboardButtons() {
    const copyBtn = document.getElementById("copyButton");
    const pasteBtn = document.getElementById("pasteButton");
    if (!copyBtn || !pasteBtn) {
      return;
    }
    const canEdit = isEditablePage() && !!doc;
    copyBtn.disabled = !canEdit || selectedPlacementIds.size < 1;
    pasteBtn.disabled = !canEdit || !clipboard || !clipboard.items || !clipboard.items.length;
  }

  function groupSelected() {
    const ids = Array.from(selectedPlacementIds);
    if (ids.length < 2) {
      setMessage("Shift＋クリックで2つ以上選んでから「一式」を押してください。");
      return;
    }
    pushHistory();
    const group = createGroup(doc, ids, DEFAULT_GROUP_NAME);
    if (!group) {
      historyPast.pop();
      updateHistoryButtons();
      setMessage("グループ化できませんでした。");
      return;
    }
    setSelection(group.placementIds.slice());
    persist();
    refresh();
    setMessage("「" + group.name + "」にグループ化しました。");
  }

  function ungroupSelected() {
    const groups = new Map();
    selectedPlacementIds.forEach((id) => {
      const group = findGroupByPlacement(doc, id);
      if (group) {
        groups.set(group.id, group);
      }
    });
    if (!groups.size) {
      setMessage("解除できる一式がありません。");
      return;
    }
    pushHistory();
    groups.forEach((group) => ungroup(doc, group.id));
    persist();
    refresh();
    setMessage("一式を解除しました。");
  }

  function bringSelection(direction) {
    if (!isEditablePage() || !doc) {
      return;
    }
    const ids = Array.from(selectedPlacementIds);
    if (!ids.length) {
      setMessage("設備を選んでから前面／背面を押してください。");
      return;
    }
    pushHistory();
    const ok = reorderPlacements(doc, ids, direction);
    if (!ok) {
      historyPast.pop();
      updateHistoryButtons();
      setMessage("順序は変わりませんでした。");
      return;
    }
    persist();
    refresh();
    setMessage(direction === "front"
      ? "選択中を前面にしました。"
      : "選択中を背面にしました。");
  }

  function deleteSelected() {
    if (!selectedPlacementIds.size) {
      return;
    }
    pushHistory();
    const ids = Array.from(selectedPlacementIds);
    if (isEditingBeforePage() && hasAfterPage(project)) {
      // 削除前にリンク先を特定し、追従／切り離しに関係なくアフターからも消す
      const afterDoc = workDocFromProject(project, PAGE_AFTER);
      const before = project.pages.before;
      const after = project.pages.after;
      const afterIds = [];
      ids.forEach((beforePlId) => {
        const beforePl = before.drawing.placements.find((pl) => pl.id === beforePlId);
        if (!beforePl) {
          return;
        }
        const afterPl = findLinkedAfterPlacement(before, after, beforePl);
        if (afterPl) {
          afterIds.push(afterPl.id);
        }
      });
      ids.forEach((id) => removePair(doc, id));
      afterIds.forEach((id) => removePair(afterDoc, id));
      setSelection([]);
      mirrorBeforeToAfter(project);
      persist();
      refresh();
      setMessage("ビフォアから削除し、対応するアフター設備も削除しました。");
      return;
    }
    ids.forEach((id) => removePair(doc, id));
    setSelection([]);
    persist();
    refresh();
    setMessage(project.activePage === PAGE_AFTER
      ? "アフターから削除しました（ビフォアはそのままです）。"
      : "削除しました。");
  }

  function applyEditorDims() {
    const placement = findPlacement(doc, primarySelectedId());
    const equipment = placement ? findEquipment(doc, placement.equipmentId) : null;
    if (!equipment) {
      return;
    }
    const values = { name: nameInput.value.trim() };
    const def = equipmentTypeOf(equipment.type);
    def.fields.forEach((field) => {
      const input = document.getElementById("ed_" + field.key);
      values[field.key] = input ? input.value : "";
    });
    const shapeInput = document.getElementById("ed_shape");
    if (shapeInput) {
      values.shape = shapeInput.value;
    }
    const lengthInput = document.getElementById("ed_lengthMm");
    if (isPipeType(equipment.type) && lengthInput) {
      values.lengthMm = lengthInput.value;
    }
    const missing = requiredDimsPresent(equipment.type, values);
    if (!values.name) {
      setMessage("名称を入力してください。");
      return;
    }
    if (missing.length) {
      setMessage("必須寸法が未入力です: " + missing.join("、"));
      return;
    }
    let pipeLength = null;
    if (isPipeType(equipment.type)) {
      pipeLength = parseOptionalMm(values.lengthMm);
      if (pipeLength == null) {
        setMessage("長さを入力してください。");
        return;
      }
      if (snapMm(pipeLength) < MOVE_STEP_MM) {
        setMessage("長さは " + formatMm(MOVE_STEP_MM) + " 以上にしてください。");
        return;
      }
    }
    pushHistory();
    let pipeLengthResult = null;
    if (isPipeType(equipment.type)) {
      pipeLengthResult = setPipeLengthMm(placement, equipment, pipeLength, doc.site);
      if (!pipeLengthResult.ok) {
        historyPast.pop();
        updateHistoryButtons();
        setMessage(pipeLengthResult.message || "長さを変更できませんでした。");
        return;
      }
      updateEquipmentDimensions(equipment, {
        name: values.name,
        diameterMm: values.diameterMm,
        lengthMm: pipeLengthMm(placement)
      });
      syncPipeDimensions(equipment, placement);
    } else {
      updateEquipmentDimensions(equipment, values);
      clampPlacementToSite(placement, equipment, doc.site);
    }
    if (project.activePage === PAGE_AFTER) {
      detachAfterPlacements([placement]);
      persist();
      refresh();
      if (pipeLengthResult && pipeLengthResult.truncated) {
        setMessage(pipeLengthResult.message);
      } else {
        setMessage("アフターの寸法を更新しました。この設備はビフォアの変更に追従しません。");
      }
      return;
    }
    if (isEditingBeforePage() && hasAfterPage(project)) {
      mirrorBeforeToAfter(project);
    }
    persist();
    refresh();
    if (pipeLengthResult && pipeLengthResult.truncated) {
      setMessage(pipeLengthResult.message);
    } else if (isPipeType(equipment.type)) {
      const dia = equipment.dimensions.diameterMm;
      setMessage(
        "配管を更新しました（長さ " + formatMm(equipment.dimensions.lengthMm) +
        "／太さ " + (dia != null ? dia + "A" : "未確認") + "）。"
      );
    } else {
      setMessage("寸法を更新しました。位置は変えていません。");
    }
  }

    ["moveUp", "moveDown", "moveLeft", "moveRight"].forEach((id) => {
      document.getElementById(id).disabled = !enabled;
    });

  function refreshEditor() {
    const deleteBtn = document.getElementById("deleteButton");
    const groupBtn = document.getElementById("groupButton");
    const ungroupBtn = document.getElementById("ungroupButton");
    const frontBtn = document.getElementById("frontButton");
    const backBtn = document.getElementById("backButton");
    if (!isEditablePage() || !doc) {
      inspector.hidden = true;
      editor.hidden = true;
      selectionLabel.textContent = "寸法";
      deleteBtn.disabled = true;
      groupBtn.disabled = true;
      ungroupBtn.disabled = true;
      frontBtn.disabled = true;
      backBtn.disabled = true;
      setCrossPadEnabled(false);
      updateClipboardButtons();
      return;
    }
    const placement = findPlacement(doc, primarySelectedId());
    const equipment = placement ? findEquipment(doc, placement.equipmentId) : null;
    const multiCount = selectedPlacementIds.size;
    const inGroup = placement ? findGroupByPlacement(doc, placement.id) : null;
    groupBtn.disabled = multiCount < 2;
    ungroupBtn.disabled = !Array.from(selectedPlacementIds).some((id) => findGroupByPlacement(doc, id));
    frontBtn.disabled = multiCount < 1;
    backBtn.disabled = multiCount < 1;
    updateClipboardButtons();
    if (!equipment) {
      inspector.hidden = true;
      editor.hidden = true;
      selectionLabel.textContent = "寸法";
      deleteBtn.disabled = true;
      frontBtn.disabled = true;
      backBtn.disabled = true;
      setCrossPadEnabled(false);
      return;
    }
    inspector.hidden = false;
    editor.hidden = false;
    deleteBtn.disabled = false;
    setCrossPadEnabled(true);
    if (multiCount > 1 || inGroup) {
      selectionLabel.textContent = (inGroup ? inGroup.name : "複数選択") +
        "（" + multiCount + "）／編集: " + equipmentTypeOf(equipment.type).label;
    } else {
      selectionLabel.textContent = equipmentTypeOf(equipment.type).label;
    }
    nameInput.value = equipment.name;
    dimFields.innerHTML = "";
    const flat = flattenDims(equipment);
    if (isPipeType(equipment.type)) {
      syncPipeDimensions(equipment, placement);
      flat.lengthMm = equipment.dimensions.lengthMm;
      const lengthLabel = document.createElement("label");
      lengthLabel.textContent = "長さ";
      const lengthInput = document.createElement("input");
      lengthInput.id = "ed_lengthMm";
      lengthInput.type = "text";
      lengthInput.inputMode = "numeric";
      lengthInput.value = flat.lengthMm == null ? "" : String(flat.lengthMm);
      lengthInput.title = "長さ（mm）。始点と向きはそのまま、終点が動きます";
      lengthInput.placeholder = "mm";
      lengthLabel.appendChild(lengthInput);
      dimFields.appendChild(lengthLabel);
    }
    equipmentTypeOf(equipment.type).fields.forEach((field) => {
      const label = document.createElement("label");
      label.appendChild(document.createTextNode(shortDimLabel(field)));
      if (field.key === "heightMm") {
        label.classList.add("field-height");
      }
      const input = document.createElement("input");
      input.id = "ed_" + field.key;
      input.type = "text";
      input.inputMode = "numeric";
      input.title = field.unitSuffix
        ? (field.label + "（数字のみ。" + field.unitSuffix + "は欄外）" + (field.required ? "" : "／未確認可"))
        : (field.label + (field.required ? "" : "（任意・未確認可）"));
      input.placeholder = field.unitSuffix
        ? "例: 25"
        : (field.key === "heightMm"
          ? "未確認可"
          : (field.required ? "mm" : "未確認"));
      input.value = flat[field.key] == null ? "" : String(flat[field.key]);
      if (field.unitSuffix) {
        const row = document.createElement("span");
        row.className = "unit-input-row";
        row.appendChild(input);
        const suffix = document.createElement("span");
        suffix.className = "unit-suffix";
        suffix.textContent = field.unitSuffix;
        row.appendChild(suffix);
        label.appendChild(row);
      } else {
        label.appendChild(input);
      }
      dimFields.appendChild(label);
    });
    if (equipmentTypeOf(equipment.type).allowsCustomShape) {
      const label = document.createElement("label");
      label.textContent = "形状";
      const select = document.createElement("select");
      select.id = "ed_shape";
      select.innerHTML = '<option value="rect">長方形</option><option value="circle">円形</option>';
      select.value = equipment.shape || "rect";
      label.appendChild(select);
      dimFields.appendChild(label);
    }
  }

  function refresh() {
    updatePageChrome();
    if (isCompareMode()) {
      drawCompareScenes();
      refreshEditor();
      const zoomPct = Math.round(compareView.scale / 0.012 * 100);
      statusBar.textContent =
        "Compare ／ same zoom " + zoomPct + "% ／ Fit / Zoom shared";
      return;
    }
    restoreEditView();
    if (doc) {
      drawScene(canvas, doc, selectedPlacementIds, null, {
        pageRole: project.activePage === PAGE_AFTER ? "after" : "before"
      });
      if (placing && pipeStart && isLinePlaceType(pendingType)) {
        const ctx = canvas.getContext("2d");
        const tip = pipeHover || pipeStart;
        drawPipeDraft(ctx, pipeStart, tip);
      }
    }
    refreshEditor();
    const step = DrawView.gridStepMm || chooseGridStepMm();
    const zoomPct = Math.round(DrawView.scale / 0.012 * 100);
    const pageLabel = project.activePage === PAGE_AFTER ? "After" : "Before";
    statusBar.textContent =
      pageLabel +
      " ／ 方眼 " + formatMm(step) +
      " ／ 移動 " + formatMm(MOVE_STEP_MM) +
      " ／ " + formatMm(SITE_WIDTH_MM) + "×" + formatMm(SITE_DEPTH_MM) +
      " ／ " + zoomPct + "%" +
      (selectedPlacementIds.size ? " ／ 選択 " + selectedPlacementIds.size : "");
